[package]
name = "gamedockpanel"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gamedockpanel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Environment",
    "Win32_Storage_FileSystem",
] }
window-vibrancy = "0.7"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSView",
    "NSWindow",
    "NSTrackingArea",
    "NSWorkspace",
    "NSRunningApplication",
    "NSApplication",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    # NSResponder + NSAnimation gate NSWindow/NSView's
    # `NSAnimatablePropertyContainer` conformance (`.animator()`);
    # NSAnimationContext + block2 are for grouping the window-frame and
    # vibrancy-pill-frame animations together — see `sync_dock_geometry`.
    "NSResponder",
    "NSAnimation",
    "NSAnimationContext",
    "NSScreen",
    "block2",
] }
objc2-foundation = { version = "0.3", features = [
    "NSNotification",
    "NSString",
    "NSURL",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSBundle",
    # `kAEReopenApplication` — restore minimized/hidden windows on dock click.
    "NSAppleEventDescriptor",
    "NSError",
    "libc",
    "objc2-core-services",
] }
objc2-core-services = { version = "0.3", features = ["AEDataModel", "AERegistry", "AppleEvents"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage"] }
block2 = "0.6"
window-vibrancy = "0.7"
# Explicit, justified exception to "no new deps without a reason" (see
# CLAUDE.md): the icon pipeline needs byte->base64 for data URLs, and a
# hand-rolled encoder's padding-boundary logic (remainder 1/2 bytes) is
# exactly the kind of bug that silently corrupts specific icons instead of
# failing loudly. `base64` is a zero-transitive-dep, de-facto-standard crate.
base64 = "0.22"
