[package]
name = "gamedockpanel"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gamedockpanel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSView",
    "NSWindow",
    "NSTrackingArea",
    "NSWorkspace",
    "NSRunningApplication",
    "NSApplication",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
] }
objc2-foundation = { version = "0.3", features = [
    "NSNotification",
    "NSString",
    "NSURL",
    "NSArray",
    "NSData",
    "NSDictionary",
] }
objc2-core-graphics = { version = "0.3", features = ["CGImage"] }
block2 = "0.6"
window-vibrancy = "0.7"
# Explicit, justified exception to "no new deps without a reason" (see
# CLAUDE.md): the icon pipeline needs byte->base64 for data URLs, and a
# hand-rolled encoder's padding-boundary logic (remainder 1/2 bytes) is
# exactly the kind of bug that silently corrupts specific icons instead of
# failing loudly. `base64` is a zero-transitive-dep, de-facto-standard crate.
base64 = "0.22"
