name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: GameDockPanel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GameDockPanel/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: gamedockpanel-macos
          path: |
            GameDockPanel/src-tauri/target/release/bundle/dmg/*.dmg
            GameDockPanel/src-tauri/target/release/bundle/macos/*.app
